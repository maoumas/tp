<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisualCue V20 - Direct Edit</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bangers&family=Bebas+Neue&family=Oswald:wght@700&family=Roboto:ital,wght@0,700;1,700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #E62117;
            --panel-bg: #1e1e1e;
            --input-bg: #2d2d2d;
            --border-color: #444;
            --success-color: #28a745;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .header-actions {
            width: 100%; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-bg); border-bottom: 1px solid var(--border-color);
            height: 60px; flex-shrink: 0;
        }
        .header-title h1 { margin: 0; font-size: 1.1rem; font-family: 'Archivo Black'; text-transform: uppercase; }
        
        .lang-group { display: flex; gap: 5px; }
        .lang-btn {
            padding: 4px 8px; background: var(--input-bg); border: 1px solid var(--border-color);
            color: var(--text-color); cursor: pointer; border-radius: 4px; font-size: 0.75rem;
        }
        .lang-btn.active { background: var(--accent-color); border-color: var(--accent-color); color: white; }

        /* --- WORKBENCH --- */
        .workbench-container {
            display: flex; flex: 1; overflow: hidden; width: 100%;
        }

        /* PREVIEW PANE */
        .preview-pane {
            flex: 2; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; border-right: 1px solid var(--border-color); position: relative;
        }

        .canvas-toolbar {
            display: flex; gap: 10px; margin-bottom: 10px;
            background: rgba(30,30,30,0.8); padding: 5px 10px; border-radius: 20px;
            border: 1px solid var(--border-color); z-index: 10;
        }
        .format-btn {
            background: transparent; border: none; color: #ccc; cursor: pointer; font-size: 1.2rem;
            padding: 5px; transition: 0.2s;
        }
        .format-btn:hover, .format-btn.active { color: var(--accent-color); transform: scale(1.1); }

        .canvas-wrapper {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 1px solid #333;
            max-width: 100%; max-height: 100%;
        }
        #canvas { display: block; max-width: 100%; max-height: 75vh; object-fit: contain; cursor: default; }

        /* CONTROLS PANE */
        .controls-pane {
            flex: 1; min-width: 320px; max-width: 400px;
            background: var(--bg-color); overflow-y: auto;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
        }

        .download-btn {
            width: 100%; padding: 12px;
            background: var(--success-color); color: white; font-family: 'Archivo Black', sans-serif;
            font-size: 1rem; text-transform: uppercase; border: none; border-radius: 6px;
            cursor: pointer; margin-bottom: 10px;
        }
        .download-btn:hover { filter: brightness(1.1); }

        .panel { 
            background: var(--panel-bg); padding: 15px; 
            border-radius: 8px; border: 1px solid var(--border-color); 
        }
        .panel-title { 
            font-size: 0.8rem; font-weight: bold; color: var(--accent-color); 
            text-transform: uppercase; margin-bottom: 10px; display: block; 
            border-bottom: 1px solid #333; padding-bottom: 5px;
        }

        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; color: #888; font-weight: bold; margin-bottom: 4px; }
        input[type="text"], select {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border-color);
            color: white; padding: 8px; border-radius: 4px; font-size: 0.9rem;
        }
        
        /* Controles de estilo compactos */
        .style-row { display: flex; gap: 8px; align-items: center; margin-top: 5px; }
        input[type="color"] { border: none; width: 40px; height: 35px; padding: 0; background: none; cursor: pointer; }
        .checkbox-btn {
            width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;
            background: var(--input-bg); border: 1px solid var(--border-color); color: white;
            cursor: pointer; font-weight: bold; border-radius: 4px; font-family: 'Times New Roman', serif; font-size: 1.1rem;
        }
        .checkbox-btn.active { background: var(--accent-color); border-color: var(--accent-color); }

        .hint-text { font-size: 0.75rem; color: #666; font-style: italic; margin-top: 5px; }

        .tool-btn {
            width: 100%; background: #333; border: 1px dashed #666; 
            color: #fff; padding: 10px; border-radius: 4px; cursor: pointer;
        }
        
        .pane-footer { margin-top: auto; padding-top: 20px; font-size: 0.7rem; color: #555; text-align: center; }
        .pane-footer a { color: #777; text-decoration: none; }

        @media (max-width: 900px) {
            .workbench-container { flex-direction: column; overflow-y: auto; }
            .preview-pane { flex: none; height: 55vh; border-right: none; border-bottom: 1px solid var(--border-color); }
            .controls-pane { flex: none; overflow-y: visible; }
            body { overflow: auto; }
        }
    </style>
</head>
<body>

    <header class="header-actions">
        <div class="header-title">
            <h1 data-key="mainTitle">VisualCue <span style="color:var(--accent-color)">V20</span></h1>
        </div>
        <div class="lang-group">
            <button class="lang-btn" onclick="setLang('es')">ES</button>
            <button class="lang-btn active" onclick="setLang('de')">DE</button>
        </div>
    </header>

    <div class="workbench-container">
        
        <div class="preview-pane">
            <div class="canvas-toolbar">
                <button class="format-btn active" id="btn169" onclick="setFormat('16:9')"><i class="fa-solid fa-desktop"></i></button>
                <button class="format-btn" id="btn916" onclick="setFormat('9:16')"><i class="fa-solid fa-mobile-screen"></i></button>
            </div>
            <div class="canvas-wrapper">
                <canvas id="canvas" width="1280" height="720"></canvas>
            </div>
            <p class="hint-text" style="margin-top:10px;"><i class="fa-solid fa-hand-pointer"></i> Click elements to Move/Resize</p>
        </div>

        <div class="controls-pane">
            <button class="download-btn" onclick="downloadImage()" data-key="btnDownload">DOWNLOAD IMAGE</button>

            <div class="panel">
                <span class="panel-title" data-key="sectionText">Text Layers</span>
                
                <div class="control-group">
                    <label data-key="lblTitle">HEADLINE</label>
                    <input type="text" id="titleText" value="THE TRUTH ABOUT..." oninput="updateTextContent('title')">
                    <div class="style-row">
                        <select id="titleFont" onchange="draw()">
                            <option value="'Archivo Black', sans-serif">Archivo Black</option>
                            <option value="'Anton', sans-serif">Anton</option>
                            <option value="'Bangers', cursive">Bangers</option>
                        </select>
                        <input type="color" id="titleColor" value="#FFFFFF" oninput="draw()" title="Text Color">
                        <input type="color" id="titleBg" value="#CC0000" oninput="draw()" title="Background Color">
                        <div class="checkbox-btn" id="btnItalicTitle" onclick="toggleItalic('title')">I</div>
                    </div>
                </div>

                <hr style="border-color:#333; opacity:0.3; margin:10px 0;">

                <div class="control-group">
                    <label data-key="lblDesc">SUBTITLE</label>
                    <input type="text" id="descText" value="Details here..." oninput="updateTextContent('desc')">
                    <div class="style-row">
                        <select id="descFont" onchange="draw()">
                            <option value="'Roboto', sans-serif">Roboto</option>
                            <option value="'Anton', sans-serif">Anton</option>
                        </select>
                        <input type="color" id="descColor" value="#FFFFFF" oninput="draw()">
                        <input type="color" id="descBg" value="#000000" oninput="draw()">
                        <div class="checkbox-btn" id="btnItalicDesc" onclick="toggleItalic('desc')">I</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <span class="panel-title" data-key="sectionBg">Images</span>
                <div id="layerList" style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px;"></div>
                <button class="tool-btn" onclick="document.getElementById('imgUpload').click()" data-key="btnAddImg">+ Add Image</button>
                <input type="file" id="imgUpload" multiple accept="image/*" style="display:none" onchange="handleImages(this)">
                <button class="tool-btn" style="margin-top:5px; background:#444; border:none;" onclick="resetImages()">Reset Images</button>
            </div>

            <div class="pane-footer">
                &copy; <span id="year">2025</span> Mauricio Umana.<br>
                <a href="https://youtube.com/@translatedpressde" target="_blank"><i class="fa-brands fa-youtube"></i> YouTube</a> | 
                <a href="https://tpascal.com" target="_blank"><i class="fa-solid fa-globe"></i> tpascal.com</a>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ESTADO GLOBAL ---
        const translations = {
            es: { mainTitle: 'VisualCue <span style="color:var(--accent-color)">V20</span>', btnDownload: 'DESCARGAR', sectionText: 'Capas de Texto', lblTitle: 'TÍTULO', lblDesc: 'SUBTÍTULO', sectionBg: 'Imágenes', btnAddImg: '+ Imagen' },
            de: { mainTitle: 'VisualCue <span style="color:var(--accent-color)">V20</span>', btnDownload: 'HERUNTERLADEN', sectionText: 'Textebenen', lblTitle: 'TITEL', lblDesc: 'UNTERTITEL', sectionBg: 'Bilder', btnAddImg: '+ Bild' }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let currentFormat = '16:9';

        // Estructura de Datos para Texto (Eliminamos dependencia de sliders)
        let texts = {
            title: { text: "THE TRUTH ABOUT...", x: 0, y: -50, size: 90, width: 0, height: 0, italic: false },
            desc:  { text: "Details here...", x: 0, y: 150, size: 50, width: 0, height: 0, italic: false }
        };

        let images = [];
        
        // Estado de Interacción
        let selection = {
            type: null, // 'text' o 'image'
            id: null,   // 'title', 'desc' o index de imagen
            action: null, // 'move' o 'resize'
            lastX: 0,
            lastY: 0
        };

        // --- 2. INICIALIZACIÓN ---
        window.onload = () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            setLang('de');
            
            // Inicializar inputs
            document.getElementById('titleText').value = texts.title.text;
            document.getElementById('descText').value = texts.desc.text;
            
            setFormat('16:9');
        };

        function setFormat(fmt) {
            currentFormat = fmt;
            document.getElementById('btn169').classList.remove('active');
            document.getElementById('btn916').classList.remove('active');
            if(fmt === '16:9') {
                canvas.width = 1280; canvas.height = 720;
                document.getElementById('btn169').classList.add('active');
            } else {
                canvas.width = 720; canvas.height = 1280;
                document.getElementById('btn916').classList.add('active');
            }
            // Reset positions to center
            texts.title.x = canvas.width / 2; texts.title.y = canvas.height * 0.4;
            texts.desc.x = canvas.width / 2; texts.desc.y = canvas.height * 0.6;
            draw();
        }

        // --- 3. DIBUJADO (RENDER LOOP) ---
        function draw() {
            // Fondo
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3.1 Imágenes
            images.forEach((imgObj, index) => {
                ctx.save();
                ctx.translate(imgObj.x, imgObj.y);
                ctx.scale(imgObj.scale, imgObj.scale);
                ctx.drawImage(imgObj.img, -imgObj.width/2, -imgObj.height/2);
                
                // Marco de selección Imagen
                if (selection.type === 'image' && selection.id === index) {
                    ctx.strokeStyle = '#00FF00'; ctx.lineWidth = 4 / imgObj.scale;
                    ctx.strokeRect(-imgObj.width/2, -imgObj.height/2, imgObj.width, imgObj.height);
                    
                    // Handle Resize (Esquina inferior derecha)
                    ctx.fillStyle = '#00FF00';
                    ctx.fillRect((imgObj.width/2) - 20, (imgObj.height/2) - 20, 40, 40);
                }
                ctx.restore();
            });

            // 3.2 Textos
            drawTextLayer('title');
            drawTextLayer('desc');
        }

        function drawTextLayer(key) {
            const t = texts[key];
            if (!t.text) return;

            // Obtener estilos del DOM
            const fontName = document.getElementById(key + 'Font').value;
            const color = document.getElementById(key + 'Color').value;
            const bgColor = document.getElementById(key + 'Bg').value;
            const fontStyle = t.italic ? 'italic bold' : 'bold';

            ctx.font = `${fontStyle} ${t.size}px ${fontName}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Cálculos de Caja (Bounding Box)
            const lines = wrapText(ctx, t.text, canvas.width * 0.9);
            const lineHeight = t.size * 1.2;
            const totalHeight = lines.length * lineHeight;
            
            // Guardar dimensiones para Hit Test
            // Estimamos el ancho máximo de las líneas
            let maxWidth = 0;
            lines.forEach(l => { const m = ctx.measureText(l); if(m.width > maxWidth) maxWidth = m.width; });
            t.width = maxWidth + 40; // Padding
            t.height = totalHeight + 20;

            // Dibujar Fondo y Texto
            let startY = t.y - (totalHeight / 2) + (lineHeight / 2);
            
            lines.forEach(line => {
                // Fondo por línea
                if (bgColor !== 'transparent') {
                    const lineWidth = ctx.measureText(line).width + 30;
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(t.x - lineWidth/2, startY - lineHeight/2, lineWidth, lineHeight);
                }
                
                // Texto
                ctx.fillStyle = color;
                ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 8;
                ctx.fillText(line, t.x, startY);
                ctx.shadowBlur = 0;
                startY += lineHeight;
            });

            // Marco de Selección TEXTO
            if (selection.type === 'text' && selection.id === key) {
                ctx.save();
                ctx.strokeStyle = '#E62117'; ctx.lineWidth = 2;
                ctx.setLineDash([10, 5]); // Línea punteada
                // Dibujamos un rectángulo general aproximado
                ctx.strokeRect(t.x - t.width/2, t.y - t.height/2, t.width, t.height);
                
                // Handle Resize (Círculo Verde en esquina)
                ctx.fillStyle = '#28a745';
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.arc(t.x + t.width/2, t.y + t.height/2, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            }
        }

        function wrapText(context, text, maxWidth) {
            const words = text.split(' ');
            let lines = [];
            let currentLine = words[0];
            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = context.measureText(currentLine + " " + word).width;
                if (width < maxWidth) currentLine += " " + word;
                else { lines.push(currentLine); currentLine = word; }
            }
            lines.push(currentLine);
            return lines;
        }

        // --- 4. INTERACCIÓN (MOUSE/TOUCH) ---
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let cx = e.clientX, cy = e.clientY;
            if(e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
        }

        // HIT TEST: ¿Dónde hizo clic el usuario?
        function hitTest(x, y) {
            // 1. Revisar Textos (Prioridad Alta)
            // Primero revisamos el Handle de Resize si hay algo seleccionado
            if (selection.type === 'text') {
                const t = texts[selection.id];
                const hx = t.x + t.width/2;
                const hy = t.y + t.height/2;
                if (Math.abs(x - hx) < 30 && Math.abs(y - hy) < 30) return { type:'text', id:selection.id, action:'resize' };
            }

            // Revisar Cajas de Texto
            for (const key of ['title', 'desc']) {
                const t = texts[key];
                if (x > t.x - t.width/2 && x < t.x + t.width/2 && y > t.y - t.height/2 && y < t.y + t.height/2) {
                    return { type:'text', id:key, action:'move' };
                }
            }

            // 2. Revisar Imágenes (Inverso para seleccionar la más alta)
            for (let i = images.length - 1; i >= 0; i--) {
                const img = images[i];
                // Coordenadas locales de la imagen
                const localX = (x - img.x) / img.scale;
                const localY = (y - img.y) / img.scale;
                
                // Handle Resize Imagen (si está seleccionada)
                if (selection.type === 'image' && selection.id === i) {
                    // El handle está en la esquina inferior derecha local
                    if (Math.abs(localX - img.width/2) < 40/img.scale && Math.abs(localY - img.height/2) < 40/img.scale) {
                        return { type:'image', id:i, action:'resize' };
                    }
                }

                // Cuerpo de la Imagen
                if (Math.abs(localX) < img.width/2 && Math.abs(localY) < img.height/2) {
                    return { type:'image', id:i, action:'move' };
                }
            }

            return null;
        }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('touchstart', startDrag, {passive:false});
        window.addEventListener('mousemove', doDrag);
        window.addEventListener('touchmove', doDrag, {passive:false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function startDrag(e) {
            e.preventDefault(); // Evitar scroll en móvil
            const coords = getCanvasCoords(e);
            const hit = hitTest(coords.x, coords.y);

            if (hit) {
                selection = { ...hit, lastX: coords.x, lastY: coords.y, isDragging: true };
                updateLayerListUI();
                draw();
            } else {
                selection = { type: null, id: null, action: null }; // Deseleccionar
                updateLayerListUI();
                draw();
            }
        }

        function doDrag(e) {
            if (!selection.isDragging) return;
            if (e.type === 'touchmove') e.preventDefault();
            
            const coords = getCanvasCoords(e);
            const dx = coords.x - selection.lastX;
            const dy = coords.y - selection.lastY;

            if (selection.type === 'text') {
                const t = texts[selection.id];
                if (selection.action === 'move') {
                    t.x += dx; t.y += dy;
                } else if (selection.action === 'resize') {
                    // Aumentar fuente al arrastrar handle hacia abajo/derecha
                    t.size = Math.max(10, t.size + dy/2);
                }
            } else if (selection.type === 'image') {
                const img = images[selection.id];
                if (selection.action === 'move') {
                    img.x += dx; img.y += dy;
                } else if (selection.action === 'resize') {
                    // Zoom
                    img.scale = Math.max(0.1, img.scale + (dx/500));
                }
            }

            selection.lastX = coords.x;
            selection.lastY = coords.y;
            draw();
        }

        function endDrag() {
            if (selection.isDragging) {
                selection.isDragging = false;
                // Cursor logic could go here
            }
        }

        // --- 5. LOGICA AUXILIAR ---
        function updateTextContent(key) {
            texts[key].text = document.getElementById(key + 'Text').value.toUpperCase();
            draw();
        }
        function toggleItalic(key) {
            texts[key].italic = !texts[key].italic;
            document.getElementById('btnItalic'+ (key==='title'?'Title':'Desc')).classList.toggle('active');
            draw();
        }

        function handleImages(input) {
            if (!input.files.length) return;
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.max(canvas.width/img.width, canvas.height/img.height);
                        images.push({ 
                            img: img, width: img.width, height: img.height, 
                            x: canvas.width/2, y: canvas.height/2, scale: scale 
                        });
                        // Auto-seleccionar la nueva imagen
                        selection = { type: 'image', id: images.length-1, action: null };
                        updateLayerListUI();
                        draw();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            input.value = '';
        }

        function updateLayerListUI() {
            const list = document.getElementById('layerList');
            list.innerHTML = '';
            images.forEach((_, idx) => {
                const badge = document.createElement('div');
                const isActive = (selection.type === 'image' && selection.id === idx);
                badge.style.cssText = `padding:4px 8px; background:#333; border-radius:4px; font-size:0.7rem; cursor:pointer; border:1px solid ${isActive ? '#E62117' : '#555'}; color:${isActive?'#fff':'#aaa'}`;
                badge.innerText = `Img ${idx + 1}`;
                badge.onclick = () => { selection = { type: 'image', id: idx, action: null }; draw(); updateLayerListUI(); };
                list.appendChild(badge);
            });
        }
        function resetImages() { images = []; selection = { type:null }; updateLayerListUI(); draw(); }

        function downloadImage() {
            const link = document.createElement('a'); 
            link.download = `visualcue_${currentFormat.replace(':','-')}.png`; 
            link.href = canvas.toDataURL('image/png'); link.click();
        }

        function setLang(lang) {
            const btns = document.querySelectorAll('.lang-btn');
            btns.forEach(b => b.classList.remove('active'));
            // Lógica simple para botón activo
            for(let b of btns) if(b.textContent.toLowerCase() === lang) b.classList.add('active');
            
            const t = translations[lang];
            if(t) {
                document.querySelectorAll('[data-key]').forEach(el => {
                    const k = el.getAttribute('data-key');
                    if(t[k]) el.innerHTML = t[k];
                });
            }
        }
    </script>
</body>
</html>
