<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Teleprompter Live</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background-color: black; color: white; font-family: 'Inter', sans-serif; margin:0; overflow-x:hidden; cursor: pointer; }
        #script-container { padding: 20px; padding-top: 20vh; padding-bottom: 60vh; max-width: 800px; margin: 0 auto; line-height: 1.5; opacity: 1; }
        .speaker-text { font-size: 2.8rem; font-weight: 600; color: #ffffff; margin-bottom: 1.5rem; }
        .instruction { font-size: 1.5rem; color: #FCD34D; font-style: italic; background: #333; padding: 10px; border-left: 4px solid #F59E0B; margin-bottom: 2rem; }
        .timestamp { font-size: 2rem; font-weight: 800; color: #60A5FA; border-top: 1px solid #444; padding-top: 2rem; margin-top: 3rem; text-transform: uppercase; }
        #controls { position: fixed; bottom: 0; left: 0; right: 0; background-color: #111; border-top: 1px solid #333; padding: 10px; padding-bottom: env(safe-area-inset-bottom, 10px); display: flex; align-items: center; gap: 8px; z-index: 9999; justify-content: center; overflow-x: auto; cursor: default; }
        @media (max-width: 600px) {
            #controls { justify-content: flex-start; padding-left: 10px; padding-right: 10px; }
            .btn-main, #save-btn, #reset-btn { height: 38px !important; min-width: 38px !important; padding: 0 10px !important; }
            #play-pause-btn { min-width: auto !important; padding: 0 15px !important; font-size: 0.8rem; }
            .stepper-btn { width: 34px !important; height: 34px !important; }
            .value-display { font-size: 0.8rem; min-width: 20px; }
            .speaker-text { font-size: 2rem; }
        }
        .btn-main { height: 48px; padding: 0 20px; border-radius: 8px; font-weight: 700; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition:0.2s; }
        #play-pause-btn { background-color: #10B981; min-width: 100px; } 
        #play-pause-btn.paused { background-color: #EF4444; } 
        #reset-btn { background-color: #374151; }
        #save-btn { background-color: #7C3AED; }
        .control-group { display: flex; align-items: center; gap: 2px; background: #222; padding: 3px; border-radius: 8px; border: 1px solid #444; flex-shrink: 0; }
        .stepper-btn { width: 44px; height: 44px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; background: transparent; }
        .theme-speed .stepper-btn { background: #1E40AF; }
        .theme-font .stepper-btn { background: #92400E; }
        .value-display { font-family: monospace; font-weight: bold; min-width: 30px; text-align: center; }
        .svg-icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>
  <div id="script-container"></div>
  <div id="controls">
    <button id="play-pause-btn" class="btn-main">START</button>
    <button id="reset-btn" class="btn-main" title="Inicio"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
    <div class="control-group theme-speed"><button class="stepper-btn" id="s-">-</button><div class="value-display" id="s-val">3</div><button class="stepper-btn" id="s+">+</button></div>
    <div class="control-group theme-font"><button class="stepper-btn" id="f-">-</button><div class="value-display" id="f-val">3</div><button class="stepper-btn" id="f+">+</button></div>
    <button id="save-btn" class="btn-main" title="Guardar"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg></button>
  </div>
  <script>
    const data = JSON.parse('[{"type":"title","content":"Die Nacht, in der Super-Bigote die Tür nicht zubekam"},{"type":"instruction","content":"Anmerkung: Der Moderator schaut mit einem sarkastischen Lächeln direkt in die Kamera."},{"type":"text","content":"Willkommen zurück bei translatedPressDE. Heute sprechen wir über das wohl spektakulärste Neujahrsgeschenk, das Lateinamerika seit Jahrzehnten erhalten hat. Während ihr wahrscheinlich noch eure Berliner gegessen habt, hat Onkel Sam beschlossen, die venezolanische Reality-Show namens Diktatur endgültig abzusetzen."},{"type":"title","content":"Ein Videospiel wird Realität"},{"type":"text","content":"Manche nennen es die Operation Steel Dawn, andere Resolution Absolute. Aber für uns ist es einfach die Geschichte, wie 150 Flugzeuge und 5000 Elitesoldaten zeigten, dass man mit dem Weißen Haus besser keine Spielchen spielt."},{"type":"text","content":"Wißt ihr, das war keine spontane Idee von Donald Trump nach einem zu starken Kaffee. Die CIA saß seit August 2025 direkt in Caracas. Die wußten alles. Was Maduro isst, welche Socken er trägt und sogar, wie seine Haustiere heißen. Es war wie eine monatelange Probe für ein High-Tech-Videospiel. Und als das Wetter am 3. Januar endlich mitspielte, hieß es: Game Over."},{"type":"instruction","content":"Anmerkung: Kurze Pause für den Effekt."},{"type":"title","content":"Das Märchen vom Ölraub"},{"type":"text","content":"Bevor jetzt die üblichen Verdächtigen schreien, die USA seien nur wegen des Öls gekommen: Spart es euch. Welches Öl denn bitte? Es gibt in Venezuela kaum noch etwas zu stehlen, das nicht schon längst weg ist."},{"type":"text","content":"Seit Hugo Chávez die glorreiche Idee hatte, alles zu enteignen, was nicht bei drei auf den Bäumen war, wurde das Land systematisch geplündert. Aber nicht von Washington. Die Kubaner, Russen und Chinesen haben sich am venezolanischen Öl bedient wie an einem All-you-can-eat-Buffet, während das Volk im Durchschnitt elf Kilo an Gewicht verlor, weil die Supermärkte so leer waren wie Maduros Versprechungen."},{"type":"text","content":"Chávez und sein Ziehsohn Maduro haben es geschafft, die größte Ölmacht der Welt wirtschaftlich so zu zertrümmern, dass die Menschen dort buchstäblich ihre Währung zu Taschen flechten mussten, weil das Papier mehr wert war als die Zahl darauf. Das ist kein Befreiungskampf, das ist wirtschaftlicher Suizid mit Ansage."},{"type":"title","content":"Cúbalibre und die Marionettenspieler"},{"type":"text","content":"Und dann haben wir da noch unsere Freunde aus Havanna. Dieses Cúbalibre-Regime hat seine Diktatur nur deshalb am Leben erhalten, weil es Venezuela wie eine Tankstelle ohne Kasse benutzt hat. Bis zu 35.000 Barrel Öl pro Tag flossen nach Kuba, um dort eine Tyrannei zu stützen, die wiederum ihren Einfluss auf ganz Lateinamerika ausdehnte."},{"type":"text","content":"Wie haben sie das gemacht? Ganz einfach: Mit korruptem Geld und den Erlösen aus dem Drogenhandel des Cartel de los Soles. Sie haben Regierungen in der Region unterwandert und mit dem Geld des hungernden venezolanischen Volkes eine Art linke Mafia-Infrastruktur aufgebaut. Man könnte sagen, sie haben die Politik amerikanisiert – im Sinne einer grenzüberschreitenden Kriminalität, die nur dazu diente, die Macht der Elite zu zementieren."},{"type":"instruction","content":"Anmerkung: Sardonischer Unterton."},{"type":"title","content":"Der Zugriff: Zu langsam für den Bunker"},{"type":"text","content":"Kommen wir zum eigentlichen Showdown. Maduro dachte wohl, er sei in seiner Festung in Fuerte Tiuna sicher. Er hatte sogar einen speziellen Sicherheitsraum aus Stahl – einen Bunker für den Fall, dass es brenzlig wird."},{"type":"text","content":"Aber dumm gelaufen: Die US-Spezialeinheiten waren schneller als sein Wille zur Flucht. Er hat es nicht einmal geschafft, die Stahltür hinter sich zuzuziehen. Da stand er nun, der große Revolutionär, und ergab sich zusammen mit seiner Frau Cilia Flores."},{"type":"text","content":"Besonders peinlich für Havanna: 32 kubanische Agenten, die Maduros innersten Sicherheitsring bildeten, wurden bei dem Einsatz ausgeschaltet. So viel zur unbesiegbaren kubanischen Garde. Sie starben für eine leere, korrupte Sache, während ihr Chef in Handschellen auf ein US-Kriegsschiff verladen wurde."},{"type":"title","content":"Happy New Year in Manhattan"},{"type":"text","content":"Jetzt sitzt Maduro in New York. Kein Palast, kein Fernsehen, nur ein US-Bundesgericht und eine Anklage wegen Drogenterrors. Als er aus dem Auto stieg, wünschte er den Beamten auf Englisch noch ein Happy New Year."},{"type":"text","content":"Das nennen wir mal Humor. Die Ironie ist fast so groß wie seine zukünftige Gefängniszelle. Venezuela hat jetzt die Chance, wieder eine pralle Nation zu werden, statt nur die Melkkuh für Havanna, Moskau und Peking zu sein."},{"type":"text","content":"Was meint ihr? War dieser chirurgische Eingriff längst überfällig oder ist das der Beginn eines neuen Chaos? Schreibt es uns in die Kommentare."},{"type":"text","content":"Bis zum nächsten Mal bei translatedPressDE. Und denkt daran: Wenn ihr einen Bunker habt, stellt sicher, dass die Tür leicht geölt ist."},{"type":"instruction","content":"Anmerkung: Der Moderator zwinkert und das Bild blendet aus."}]');
    const cont = document.getElementById('script-container');
    data.forEach(i => {
        let el = document.createElement(i.type==='title'?'h2':i.type==='instruction'?'p':'div');
        el.className = i.type==='title'?'timestamp':i.type==='instruction'?'instruction':'speaker-text';
        el.innerText = i.content; cont.appendChild(el);
    });
    let state = { speed:3, font:3, playing:false };
    let anim;
    function update() {
        document.getElementById('s-val').innerText = state.speed;
        document.getElementById('f-val').innerText = state.font;
        const fs = 20 + (state.font * 4);
        document.querySelectorAll('.speaker-text').forEach(e => e.style.fontSize = fs+'px');
    }
    function loop() {
        if(!state.playing) return;
        window.scrollBy(0, state.speed * 0.4);
        anim = requestAnimationFrame(loop);
    }
    function togglePlay() {
        state.playing = !state.playing;
        const btn = document.getElementById('play-pause-btn');
        btn.innerText = state.playing ? "PAUSE" : "START";
        btn.classList.toggle('paused', state.playing);
        if(state.playing) loop(); else cancelAnimationFrame(anim);
    }
    document.getElementById('play-pause-btn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
    document.getElementById('reset-btn').onclick = (e) => { e.stopPropagation(); window.scrollTo(0,0); state.playing=false; cancelAnimationFrame(anim); const btn = document.getElementById('play-pause-btn'); btn.innerText="START"; btn.classList.remove('paused'); };
    document.body.onclick = (e) => { if (!e.target.closest('#controls')) togglePlay(); };
    document.getElementById('controls').onclick = (e) => { e.stopPropagation(); };
    document.getElementById('s-').onclick = () => { if(state.speed>0) state.speed--; update(); };
    document.getElementById('s+').onclick = () => { if(state.speed<20) state.speed++; update(); };
    document.getElementById('f-').onclick = () => { if(state.font>0) state.font--; update(); };
    document.getElementById('f+').onclick = () => { if(state.font<15) state.font++; update(); };
    document.getElementById('save-btn').onclick = () => {
        const blob = new Blob([document.documentElement.outerHTML], {type:'text/html'});
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'teleprompter-recording.html';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
    setTimeout(() => { if(!state.playing) togglePlay(); }, 2000);
    update();
  </script>
</body>
</html>
