<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Teleprompter Live</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background-color: black; color: white; font-family: 'Inter', sans-serif; margin:0; overflow-x:hidden; cursor: pointer; }
        #script-container { padding: 20px; padding-top: 20vh; padding-bottom: 60vh; max-width: 800px; margin: 0 auto; line-height: 1.5; opacity: 1; }
        .speaker-text { font-size: 2.8rem; font-weight: 600; color: #ffffff; margin-bottom: 1.5rem; }
        .instruction { font-size: 1.5rem; color: #FCD34D; font-style: italic; background: #333; padding: 10px; border-left: 4px solid #F59E0B; margin-bottom: 2rem; }
        .timestamp { font-size: 2rem; font-weight: 800; color: #60A5FA; border-top: 1px solid #444; padding-top: 2rem; margin-top: 3rem; text-transform: uppercase; }
        #controls { position: fixed; bottom: 0; left: 0; right: 0; background-color: #111; border-top: 1px solid #333; padding: 10px; padding-bottom: env(safe-area-inset-bottom, 10px); display: flex; align-items: center; gap: 8px; z-index: 9999; justify-content: center; overflow-x: auto; cursor: default; }
        @media (max-width: 600px) {
            #controls { justify-content: flex-start; padding-left: 10px; padding-right: 10px; }
            .btn-main, #save-btn, #reset-btn { height: 38px !important; min-width: 38px !important; padding: 0 10px !important; }
            #play-pause-btn { min-width: auto !important; padding: 0 15px !important; font-size: 0.8rem; }
            .stepper-btn { width: 34px !important; height: 34px !important; }
            .value-display { font-size: 0.8rem; min-width: 20px; }
            .speaker-text { font-size: 2rem; }
        }
        .btn-main { height: 48px; padding: 0 20px; border-radius: 8px; font-weight: 700; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition:0.2s; }
        #play-pause-btn { background-color: #10B981; min-width: 100px; } 
        #play-pause-btn.paused { background-color: #EF4444; } 
        #reset-btn { background-color: #374151; }
        #save-btn { background-color: #7C3AED; }
        .control-group { display: flex; align-items: center; gap: 2px; background: #222; padding: 3px; border-radius: 8px; border: 1px solid #444; flex-shrink: 0; }
        .stepper-btn { width: 44px; height: 44px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; background: transparent; }
        .theme-speed .stepper-btn { background: #1E40AF; }
        .theme-font .stepper-btn { background: #92400E; }
        .value-display { font-family: monospace; font-weight: bold; min-width: 30px; text-align: center; }
        .svg-icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>
  <div id="script-container"></div>
  <div id="controls">
    <button id="play-pause-btn" class="btn-main">START</button>
    <button id="reset-btn" class="btn-main" title="Inicio"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
    <div class="control-group theme-speed"><button class="stepper-btn" id="s-">-</button><div class="value-display" id="s-val">3</div><button class="stepper-btn" id="s+">+</button></div>
    <div class="control-group theme-font"><button class="stepper-btn" id="f-">-</button><div class="value-display" id="f-val">3</div><button class="stepper-btn" id="f+">+</button></div>
    <button id="save-btn" class="btn-main" title="Guardar"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg></button>
  </div>
  <script>
    const data = JSON.parse('[{"type":"title","content":"Der Fall Ojeda: Vom „langen Arm“ Caracas’ bis zur New Yorker Zelle"},{"type":"instruction","content":"Kamera 1: Ernsthafter Blick, leichtes Hochziehen einer Augenbraue.*"},{"type":"text","content":"Willkommen bei TranslatedPressDE. Heute blicken wir auf einen Fall zurück, der als „einfaches Verbrechen“ getarnt war, sich aber als staatlich bestellter Albtraum entpuppte. Wir reden über Ronald Ojeda – und wie die Fäden schließlich bis nach New York führten."},{"type":"title","content":"21. Februar 2024: Die „PDI“-Komödie in Santiago"},{"type":"text","content":"Alles begann in einer Februarnacht in Santiago de Chile. Männer in gefälschten Uniformen der chilenischen Kriminalpolizei PDI holten den venezolanischen Ex-Militär Ronald Ojeda aus seiner Wohnung. Es gab keine Lösegeldforderung, was für echte Entführer eigentlich schlechter Stil ist. Die Familie wusste sofort: Das war kein Raubüberfall, das war die Handschrift einer Diktatur, die ihre Kritiker auch im Ausland nicht vergessen kann."},{"type":"title","content":"1. März 2024: Beton ist kein Versteck"},{"type":"text","content":"Neun Tage später die traurige Gewissheit: Ojedas Leiche wurde in einem Koffer gefunden, vergraben unter einer zwei Meter dicken Betonschicht in einem Armenviertel von Maipú. Die Todesursache? Mechanische Asphyxie nach Stunden, in denen er an seinen Händen aufgehängt wurde. Eine „interessante“ Art der Befragung, die normalerweise eher in den Handbüchern von Geheimdiensten als bei Straßengangs steht."},{"type":"title","content":"Die venezolanische „Qualitätsarbeit“ hinter den Kulissen"},{"type":"text","content":"Die Ermittlungen ergaben schnell, dass hier ein „kriminelles Outsourcing“ stattfand. Das Regime in Caracas beauftragte offenbar die „Piratas de Aragua“, eine besonders charmante Fraktion des berüchtigten Tren de Aragua, mit der Drecksarbeit. Mittendrin: Alexander Enrique Granco Arteaga, bekannt als der „Schlächter von Maduro“. Er soll die Operation angeführt haben – ein Mann, der Ojeda bereits 2017 persönlich gefoltert hatte. Man kann ihm zumindest Beständigkeit in seinen Hobbys vorwerfen."},{"type":"title","content":"Der Monsalve-Skandal und die „Zusammenarbeit“"},{"type":"instruction","content":"Kamera 2: Sarkastisches Lächeln.*"},{"type":"text","content":"Besonders pikant: Nur einen Monat vor der Entführung unterzeichneten Chile und Venezuela ein Abkommen zur polizeilichen Zusammenarbeit. Die Familie Ojeda vermutet bis heute, dass Informationen über Ronalds Aufenthaltsort im Rahmen dieser „Zusammenarbeit“ ganz bequem nach Caracas flossen. Der damalige Untersekretär Manuel Monsalve bot der Familie später Geld an, was diese dankend ablehnte – wahrscheinlich, weil man Integrität nicht in chilenischen Pesos aufwiegen kann."},{"type":"title","content":"2025: Die Schlinge zieht sich zu"},{"type":"text","content":"Das Jahr 2025 war geprägt von Auslieferungen und Geständnissen. Verdächtige wie „El Fresa“ und „Gordo Alex“ wurden gefasst und nach Chile gebracht. Die chilenische Staatsanwaltschaft unter Hector Barros blieb hartnäckig: Es war ein politischer Mord, geplant und bezahlt in Venezuela. Diosdado Cabello, Maduros Nummer zwei, versuchte die Vorwürfe mit seinem üblichen Charme wegzulächeln und nannte die chilenischen Ermittler „Idioten“ – aber wer zuletzt lacht, wissen wir ja meistens erst später."},{"type":"title","content":"Anfang 2026: Einzug in die New Yorker VIP-Suite"},{"type":"text","content":"Und damit kommen wir zum großen Finale in diesem jungen Jahr 2026. Nicolás Maduro hat seinen Palast in Miraflores gegen eine etwas weniger luxuriöse Unterkunft eingetauscht. Nach seiner Festnahme und Überstellung durch die Regierung von Präsident Trump befindet er sich nun im Metropolitan Detention Center in Brooklyn, New York."},{"type":"instruction","content":"Kamera 1: Trockener Humor.*"},{"type":"text","content":"Dort teilt er sich den Flur mit einer illustren Gesellschaft: dem Rapper Sean „Diddy“ Combs, dem Kartellboss Ismael „El Mayo“ Zambada und Ghislaine Maxwell. Man könnte sagen, es ist das exklusivste Klassentreffen der Welt für Leute, die mit dem Gesetz auf Kriegsfuß stehen. Maduro wurde bereits in seinen schicken neuen Sandalen und Handschellen der DEA gesichtet – er winkte sogar in die Kameras, als hielte er immer noch eine seiner stundenlangen Fernsehansprachen."},{"type":"title","content":"Fazit: Gerechtigkeit ist eine langsame Mühle"},{"type":"text","content":"Was als Entführung in Chile begann, endet nun vor einem US-Bundesgericht. Die Anklagen wiegen schwer: transnationale Verbrechen, politische Gewalt und der „lange Arm“, der schließlich zu kurz war. Wir bei TranslatedPressDE halten Sie auf dem Laufenden, ob Maduro in New York auch so gute Arepas bekommt wie zu Hause."},{"type":"text","content":"Vielen Dank fürs Einschalten. Bleiben Sie kritisch, bleiben Sie informiert."},{"type":"instruction","content":"Hinweis: Während die Ereignisse um Ronald Ojeda im Jahr 2024 und 2025 gut dokumentiert sind, basiert die Schilderung der Festnahme Maduros im Jahr 2026 auf den fiktiven bzw. hypothetischen Szenarien Ihrer Anfrage und aktuellen spekulativen Berichten, die nicht als historisch gesicherte Fakten außerhalb dieses Kontexts zu werten sind.*"},{"type":"text","content":"Stellen Sie sich die internationale Justiz wie einen Bumerang vor: Man wirft ihn weg, um jemanden zu treffen, aber am Ende kommt er mit voller Wucht zurück und trifft einen selbst im Nacken."}]');
    const cont = document.getElementById('script-container');
    data.forEach(i => {
        let el = document.createElement(i.type==='title'?'h2':i.type==='instruction'?'p':'div');
        el.className = i.type==='title'?'timestamp':i.type==='instruction'?'instruction':'speaker-text';
        el.innerText = i.content; cont.appendChild(el);
    });
    let state = { speed:3, font:3, playing:false };
    let anim;
    function update() {
        document.getElementById('s-val').innerText = state.speed;
        document.getElementById('f-val').innerText = state.font;
        const fs = 20 + (state.font * 4);
        document.querySelectorAll('.speaker-text').forEach(e => e.style.fontSize = fs+'px');
    }
    function loop() {
        if(!state.playing) return;
        window.scrollBy(0, state.speed * 0.4);
        anim = requestAnimationFrame(loop);
    }
    function togglePlay() {
        state.playing = !state.playing;
        const btn = document.getElementById('play-pause-btn');
        btn.innerText = state.playing ? "PAUSE" : "START";
        btn.classList.toggle('paused', state.playing);
        if(state.playing) loop(); else cancelAnimationFrame(anim);
    }
    document.getElementById('play-pause-btn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
    document.getElementById('reset-btn').onclick = (e) => { e.stopPropagation(); window.scrollTo(0,0); state.playing=false; cancelAnimationFrame(anim); const btn = document.getElementById('play-pause-btn'); btn.innerText="START"; btn.classList.remove('paused'); };
    document.body.onclick = (e) => { if (!e.target.closest('#controls')) togglePlay(); };
    document.getElementById('controls').onclick = (e) => { e.stopPropagation(); };
    document.getElementById('s-').onclick = () => { if(state.speed>0) state.speed--; update(); };
    document.getElementById('s+').onclick = () => { if(state.speed<20) state.speed++; update(); };
    document.getElementById('f-').onclick = () => { if(state.font>0) state.font--; update(); };
    document.getElementById('f+').onclick = () => { if(state.font<15) state.font++; update(); };
    document.getElementById('save-btn').onclick = () => {
        const blob = new Blob([document.documentElement.outerHTML], {type:'text/html'});
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'teleprompter-recording.html';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
    setTimeout(() => { if(!state.playing) togglePlay(); }, 2000);
    update();
  </script>
</body>
</html>
