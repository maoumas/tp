<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Teleprompter Live</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background-color: black; color: white; font-family: 'Inter', sans-serif; margin:0; overflow-x:hidden; cursor: pointer; }
        #script-container { padding: 20px; padding-top: 20vh; padding-bottom: 60vh; max-width: 800px; margin: 0 auto; line-height: 1.5; opacity: 1; }
        .speaker-text { font-size: 2.8rem; font-weight: 600; color: #ffffff; margin-bottom: 1.5rem; }
        .instruction { font-size: 1.5rem; color: #FCD34D; font-style: italic; background: #333; padding: 10px; border-left: 4px solid #F59E0B; margin-bottom: 2rem; }
        .timestamp { font-size: 2rem; font-weight: 800; color: #60A5FA; border-top: 1px solid #444; padding-top: 2rem; margin-top: 3rem; text-transform: uppercase; }
        #controls { position: fixed; bottom: 0; left: 0; right: 0; background-color: #111; border-top: 1px solid #333; padding: 10px; padding-bottom: env(safe-area-inset-bottom, 10px); display: flex; align-items: center; gap: 8px; z-index: 9999; justify-content: center; overflow-x: auto; cursor: default; }
        @media (max-width: 600px) {
            #controls { justify-content: flex-start; padding-left: 10px; padding-right: 10px; }
            .btn-main, #save-btn, #reset-btn { height: 38px !important; min-width: 38px !important; padding: 0 10px !important; }
            #play-pause-btn { min-width: auto !important; padding: 0 15px !important; font-size: 0.8rem; }
            .stepper-btn { width: 34px !important; height: 34px !important; }
            .value-display { font-size: 0.8rem; min-width: 20px; }
            .speaker-text { font-size: 2rem; }
        }
        .btn-main { height: 48px; padding: 0 20px; border-radius: 8px; font-weight: 700; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition:0.2s; }
        #play-pause-btn { background-color: #10B981; min-width: 100px; } 
        #play-pause-btn.paused { background-color: #EF4444; } 
        #reset-btn { background-color: #374151; }
        #save-btn { background-color: #7C3AED; }
        .control-group { display: flex; align-items: center; gap: 2px; background: #222; padding: 3px; border-radius: 8px; border: 1px solid #444; flex-shrink: 0; }
        .stepper-btn { width: 44px; height: 44px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; background: transparent; }
        .theme-speed .stepper-btn { background: #1E40AF; }
        .theme-font .stepper-btn { background: #92400E; }
        .value-display { font-family: monospace; font-weight: bold; min-width: 30px; text-align: center; }
        .svg-icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>
  <div id="script-container"></div>
  <div id="controls">
    <button id="play-pause-btn" class="btn-main">START</button>
    <button id="reset-btn" class="btn-main" title="Inicio"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
    <div class="control-group theme-speed"><button class="stepper-btn" id="s-">-</button><div class="value-display" id="s-val">3</div><button class="stepper-btn" id="s+">+</button></div>
    <div class="control-group theme-font"><button class="stepper-btn" id="f-">-</button><div class="value-display" id="f-val">3</div><button class="stepper-btn" id="f+">+</button></div>
    <button id="save-btn" class="btn-main" title="Guardar"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg></button>
  </div>
  <script>
    const data = JSON.parse('[{"type":"title","content":"BEGRÜSSUNG UND EINFÜHRUNG"},{"type":"text","content":"Guten Tag, liebe Freunde und Abonnenten von TranslatedpressDE. Es ist schön, dass Sie heute wieder dabei sind. Heute nehmen wir uns Zeit für ein Thema, das wie ein Spionageroman klingt, aber leider bittere Realität ist. Wir sprechen über den Aufstieg und den tiefen Fall einer Firma, die versprach, die Welt sicherer zu machen, und am Ende zu einer der größten Gefahren für unsere Privatsphäre wurde. Es geht um die israelische Firma NSO Group und ihr Programm namens Pegasus."},{"type":"text","content":"Vielleicht haben Sie diesen Namen schon einmal in den Nachrichten gehört. In den nächsten zwei Stunden werden wir ganz in Ruhe erklären, was Pegasus eigentlich ist, wie diese Firma in einem umgebauten Hühnerstall begann und warum heute sogar Regierungen vor ihr zittern. Machen Sie es sich gemütlich, holen Sie sich eine Tasse Kaffee oder Tee. Wir fangen ganz vorne an."},{"type":"title","content":"WAS IST PEGASUS EIGENTLICH?"},{"type":"text","content":"Stellen Sie sich Ihr Mobiltelefon wie Ihr Zuhause vor. Dort bewahren Sie Ihre privaten Briefe auf, das sind heute Ihre Nachrichten. Dort haben Sie Ihre Fotoalben und Sie führen dort Ihre intimsten Gespräche. Normalerweise muss ein Einbrecher eine Tür aufbrechen oder ein Fenster einschlagen, um hineinzukommen. Bei Pegasus ist das anders."},{"type":"text","content":"Experten nennen Pegasus eine Click-Zero-Software. Das bedeutet für Sie: Sie müssen gar nichts tun. Sie müssen auf keinen Link klicken und keine Datei öffnen. Der digitale Einbrecher kommt völlig lautlos durch die Luft in Ihr Telefon. Er nutzt Schwachstellen aus, die selbst die Hersteller der Telefone noch gar nicht kennen. Wenn Pegasus erst einmal auf Ihrem Gerät ist, kann es alles sehen: Ihre Nachrichten, Ihre Fotos, wo Sie sich gerade aufhalten und es kann sogar heimlich die Kamera und das Mikrofon einschalten, um Sie zu belauschen."},{"type":"title","content":"DER BESCHEIDENE ANFANG IM HÜHNERSTALL"},{"type":"text","content":"Jede große Geschichte hat einen Anfang. Die Geschichte von NSO beginnt im Jahr zweitausendzehn in Israel. Die Gründer waren zwei Schulfreunde, Shalev Hulio und Omri Lavie. Sie waren keine klassischen Geheimdienstagenten, sondern eher junge Geschäftsleute, die eine Marktlücke sahen."},{"type":"text","content":"Wissen Sie, woher der Name N-S-O kommt? Es sind einfach die Anfangsbuchstaben ihrer Vornamen: Niv, Shalev und Omri. Ihr erstes Büro war kein schicker Glasturm, sondern ein renovierter Hühnerstall in einer ländlichen Gemeinschaft. Von dort aus entwickelten sie eine Software, die sie Pegasus nannten – nach dem geflügelten Pferd der Mythologie. Shalev Hulio sagte einmal, das Programm sei wie ein Trojanisches Pferd, das durch die Luft fliegt."},{"type":"title","content":"DER ERSTE GROSSE ERFOLG: DIE JAGD AUF EL CHAPO"},{"type":"text","content":"Am Anfang war die Idee hinter Pegasus eigentlich eine gute. Die Firma wollte Regierungen helfen, Terroristen und gefährliche Kriminelle zu fangen, die sich hinter verschlüsselten Apps versteckten. Ihr erster großer Kunde war Mexiko."},{"type":"text","content":"Die Legende besagt, dass die ersten Verhandlungen in einem Nachtclub in Mexiko-Stadt stattfanden, bei Tequila und lauter Musik. Die mexikanische Regierung war erst skeptisch, aber nach einer beeindruckenden Demonstration griffen sie zu. Und tatsächlich: Pegasus spielte eine entscheidende Rolle bei der Verhaftung eines der meistgesuchten Verbrecher der Welt, dem Drogenbaron Joaquín El Chapo Guzmán. Der damalige Präsident von Mexiko rief sogar persönlich bei NSO an, um sich für dieses Weihnachtsgeschenk zu bedanken. In diesem Moment war NSO Group der Star der Technologiewelt und wurde mit einer Milliarde Dollar bewertet."},{"type":"title","content":"DIE DUNKLEN SEITEN UND DIE ROTEN LINIEN"},{"type":"text","content":"Die Gründer von NSO behaupteten immer, sie hätten rote Linien. Sie sagten, sie verkaufen nur an staatliche Behörden und nur zur Bekämpfung von Verbrechen. Doch Macht und Geld verändern oft die Perspektive. Es stellte sich heraus, dass Pegasus nicht nur gegen Drogenbosse eingesetzt wurde."},{"type":"text","content":"Journalisten auf der ganzen Welt begannen zu recherchieren. Sie fanden heraus, dass Pegasus dazu benutzt wurde, Menschen auszuspähen, die einfach nur kritische Fragen stellten. Menschenrechtsaktivisten, Anwälte und Journalisten wurden plötzlich zu Zielen. Der schrecklichste Fall war der des Journalisten Jamal Khashoggi. Es wurde festgestellt, dass Menschen aus seinem engsten Umfeld mit Pegasus überwacht wurden, bevor er ermordet wurde. Pegasus war zu einer Waffe geworden, die in den falschen Händen sehr gefährlich war."},{"type":"title","content":"PEGASUS BEI UNS IN DEUTSCHLAND"},{"type":"text","content":"Viele von Ihnen fragen sich nun sicher: Betrifft uns das auch hier in Deutschland? Die Antwort ist leider: Ja. Auch unsere deutschen Behörden haben sich für dieses mächtige Werkzeug interessiert."},{"type":"text","content":"Es kam heraus, dass das Bundeskriminalamt, die BKA, bereits im Jahr zweitausendneunzehn Lizenzen für Pegasus gekauft hat. Das geschah trotz großer rechtlicher Bedenken. In Deutschland haben wir sehr strenge Gesetze zum Schutz der Privatsphäre, die in unserer Verfassung verankert sind. Viele Experten sagten damals: Pegasus kann viel mehr, als unsere Gesetze erlauben. Es ist so, als würde man der Polizei erlauben, nicht nur das Haus eines Verdächtigen zu durchsuchen, sondern gleichzeitig auch die Häuser aller Nachbarn mit zu überwachen. Auch der Bundesnachrichtendienst, der BND, soll die Software nutzen, schweigt dazu aber beharrlich."},{"type":"title","content":"DER SKANDAL IN KOLUMBIEN"},{"type":"text","content":"Ein besonders spannendes Kapitel ereignete sich in Kolumbien. Dort gab es Berichte über einen fast filmreifen Vorgang. Elf Millionen Dollar sollen in bar mit Privatjets von Bogota nach Tel Aviv geflogen worden sein, um Pegasus zu bezahlen."},{"type":"text","content":"Das Kuriose daran war, dass diese Zahlungen unter der vorherigen Regierung stattfanden und die aktuelle Regierung behauptet, nichts davon gewusst zu haben. Es gibt sogar Berichte, dass die USA diese Käufe finanziert haben könnten, um den Drogenhandel zu bekämpfen. Aber auch dort blieb die Sorge: Wurde Pegasus vielleicht auch genutzt, um die politische Opposition auszuspähen? In Kolumbien führte das zu einer schweren diplomatischen Krise und sogar dazu, dass Geheimdienstkooperationen weltweit ausgesetzt wurden."},{"type":"title","content":"DER FALL: SANKTIONEN UND KLAGEN"},{"type":"text","content":"Wie das Sprichwort sagt: Je höher man steigt, desto tiefer fällt man. Für NSO Group begann der Abstieg im Jahr zweitausendeinundzwanzig. Eine Gruppe von Journalisten deckte im Pegasus Projekt eine Liste mit fünfzigtausend Telefonnummern auf, die als potenzielle Ziele ausgewählt worden waren."},{"type":"text","content":"Die Reaktion der großen Technologiefirmen war gewaltig. Apple und die Firma hinter Facebook und WhatsApp verklagten NSO Group. Sie sagten, die israelische Firma habe ihre Systeme missbraucht, um Nutzer anzugreifen. Aber der schwerste Schlag kam aus den USA. Die amerikanische Regierung setzte NSO Group auf eine schwarze Liste. Das bedeutet, dass amerikanische Firmen keine Geschäfte mehr mit ihnen machen dürfen. Das war für NSO wie das Entziehen der Atemluft."},{"type":"title","content":"WIE GEHT ES WEITER? EINE REFLEXION"},{"type":"text","content":"Heute ist NSO Group nicht mehr der Gigant von früher. Die Firma hat riesige Schulden, der charismatische Gründer Shalev Hulio musste zurücktreten und neue Investoren versuchen nun, das Unternehmen zu retten, indem sie es mehr in Richtung Verteidigung umbauen."},{"type":"text","content":"Was lernen wir aus dieser Geschichte, meine lieben Zuschauer? Technik an sich ist weder gut noch böse. Es kommt darauf an, in wessen Händen sie liegt und wie wir sie kontrollieren. Pegasus hat uns gezeigt, dass unsere digitale Welt zerbrechlich ist. Aber wir dürfen keine Angst haben. Wir müssen informiert bleiben und von unseren Politikern fordern, dass unsere Privatsphäre durch klare Gesetze geschützt wird."},{"type":"title","content":"EIN PAAR TIPPS FÜR SIE ZUHAUSE"},{"type":"text","content":"Auch wenn wir wahrscheinlich keine Ziele für staatliche Spione sind, können wir unsere Sicherheit im Alltag verbessern. Halten Sie Ihr Telefon immer auf dem neuesten Stand. Diese Updates sind wie neue Schlösser für Ihre Haustür. Benutzen Sie verschiedene Passwörter für Ihre Konten. Ein Passwort-Manager kann Ihnen dabei helfen, den Überblick zu behalten."},{"type":"text","content":"Es war mir eine große Freude, dieses komplexe Thema heute mit Ihnen zu besprechen. Wenn Ihnen diese Erklärung gefallen hat, geben Sie uns bitte einen Daumen nach oben und abonnieren Sie TranslatedpressDE. Teilen Sie dieses Video auch gerne mit Ihren Freunden und Verwandten. Wissen ist unser bester Schutz."},{"type":"text","content":"Vielen Dank fürs Zuschauen und bis zum nächsten Mal. Bleiben Sie sicher und behüten Sie Ihre Privatsphäre!"}]');
    const cont = document.getElementById('script-container');
    data.forEach(i => {
        let el = document.createElement(i.type==='title'?'h2':i.type==='instruction'?'p':'div');
        el.className = i.type==='title'?'timestamp':i.type==='instruction'?'instruction':'speaker-text';
        el.innerText = i.content; cont.appendChild(el);
    });
    let state = { speed:3, font:3, playing:false };
    let anim;
    function update() {
        document.getElementById('s-val').innerText = state.speed;
        document.getElementById('f-val').innerText = state.font;
        const fs = 20 + (state.font * 4);
        document.querySelectorAll('.speaker-text').forEach(e => e.style.fontSize = fs+'px');
    }
    function loop() {
        if(!state.playing) return;
        window.scrollBy(0, state.speed * 0.4);
        anim = requestAnimationFrame(loop);
    }
    function togglePlay() {
        state.playing = !state.playing;
        const btn = document.getElementById('play-pause-btn');
        btn.innerText = state.playing ? "PAUSE" : "START";
        btn.classList.toggle('paused', state.playing);
        if(state.playing) loop(); else cancelAnimationFrame(anim);
    }
    document.getElementById('play-pause-btn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
    document.getElementById('reset-btn').onclick = (e) => { e.stopPropagation(); window.scrollTo(0,0); state.playing=false; cancelAnimationFrame(anim); const btn = document.getElementById('play-pause-btn'); btn.innerText="START"; btn.classList.remove('paused'); };
    document.body.onclick = (e) => { if (!e.target.closest('#controls')) togglePlay(); };
    document.getElementById('controls').onclick = (e) => { e.stopPropagation(); };
    document.getElementById('s-').onclick = () => { if(state.speed>0) state.speed--; update(); };
    document.getElementById('s+').onclick = () => { if(state.speed<20) state.speed++; update(); };
    document.getElementById('f-').onclick = () => { if(state.font>0) state.font--; update(); };
    document.getElementById('f+').onclick = () => { if(state.font<15) state.font++; update(); };
    document.getElementById('save-btn').onclick = () => {
        const blob = new Blob([document.documentElement.outerHTML], {type:'text/html'});
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'teleprompter-recording.html';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
    setTimeout(() => { if(!state.playing) togglePlay(); }, 2000);
    update();
  </script>
</body>
</html>
