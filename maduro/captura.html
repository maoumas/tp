<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Teleprompter Live</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background-color: black; color: white; font-family: 'Inter', sans-serif; margin:0; overflow-x:hidden; cursor: pointer; }
        #script-container { padding: 20px; padding-top: 20vh; padding-bottom: 60vh; max-width: 800px; margin: 0 auto; line-height: 1.5; opacity: 1; }
        .speaker-text { font-size: 2.8rem; font-weight: 600; color: #ffffff; margin-bottom: 1.5rem; }
        .instruction { font-size: 1.5rem; color: #FCD34D; font-style: italic; background: #333; padding: 10px; border-left: 4px solid #F59E0B; margin-bottom: 2rem; }
        .timestamp { font-size: 2rem; font-weight: 800; color: #60A5FA; border-top: 1px solid #444; padding-top: 2rem; margin-top: 3rem; text-transform: uppercase; }
        #controls { position: fixed; bottom: 0; left: 0; right: 0; background-color: #111; border-top: 1px solid #333; padding: 10px; padding-bottom: env(safe-area-inset-bottom, 10px); display: flex; align-items: center; gap: 8px; z-index: 9999; justify-content: center; overflow-x: auto; cursor: default; }
        @media (max-width: 600px) {
            #controls { justify-content: flex-start; padding-left: 10px; padding-right: 10px; }
            .btn-main, #save-btn, #reset-btn { height: 38px !important; min-width: 38px !important; padding: 0 10px !important; }
            #play-pause-btn { min-width: auto !important; padding: 0 15px !important; font-size: 0.8rem; }
            .stepper-btn { width: 34px !important; height: 34px !important; }
            .value-display { font-size: 0.8rem; min-width: 20px; }
            .speaker-text { font-size: 2rem; }
        }
        .btn-main { height: 48px; padding: 0 20px; border-radius: 8px; font-weight: 700; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition:0.2s; }
        #play-pause-btn { background-color: #10B981; min-width: 100px; } 
        #play-pause-btn.paused { background-color: #EF4444; } 
        #reset-btn { background-color: #374151; }
        #save-btn { background-color: #7C3AED; }
        .control-group { display: flex; align-items: center; gap: 2px; background: #222; padding: 3px; border-radius: 8px; border: 1px solid #444; flex-shrink: 0; }
        .stepper-btn { width: 44px; height: 44px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: white; background: transparent; }
        .theme-speed .stepper-btn { background: #1E40AF; }
        .theme-font .stepper-btn { background: #92400E; }
        .value-display { font-family: monospace; font-weight: bold; min-width: 30px; text-align: center; }
        .svg-icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>
  <div id="script-container"></div>
  <div id="controls">
    <button id="play-pause-btn" class="btn-main">START</button>
    <button id="reset-btn" class="btn-main" title="Inicio"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></button>
    <div class="control-group theme-speed"><button class="stepper-btn" id="s-">-</button><div class="value-display" id="s-val">3</div><button class="stepper-btn" id="s+">+</button></div>
    <div class="control-group theme-font"><button class="stepper-btn" id="f-">-</button><div class="value-display" id="f-val">3</div><button class="stepper-btn" id="f+">+</button></div>
    <button id="save-btn" class="btn-main" title="Guardar"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg></button>
  </div>
  <script>
    const data = JSON.parse('[{"type":"title","content":"Der große Knall in Caracas: Wie Maduro im Schlafanzug abgeholt wurde"},{"type":"instruction","content":"Anmerkung: Moderator blickt mit einem verschmitzten Lächeln direkt in die Kamera, ordnet kurz seine Krawatte.*"},{"type":"text","content":"Hallo und herzlich willkommen bei TranslatedPressDE. Schön, dass Sie wieder eingeschaltet haben. Heute haben wir ein Thema, das so unglaublich klingt, dass man es fast für das Drehbuch eines drittklassigen Hollywood-Actionfilms halten könnte. Aber nein, es ist Realität. Während wir hier gemütlich unseren Kaffee getrunken haben, wurde in Venezuela Weltgeschichte geschrieben. Und zwar nicht mit diplomatischen Floskeln, sondern mit der Brechstange der Delta Force."},{"type":"title","content":"Die Nacht der absoluten Entschlossenheit"},{"type":"text","content":"Stellen Sie sich das vor: Es ist der dritte Januar, mitten in der Nacht. Während die Welt noch den Neujahrskater ausschläft, setzt die Operation Absolute Resolution ein. Über einhundertfünfzig Flugzeuge, darunter B-1 Bomber und F-18 Kampfjets, steigen von zwanzig verschiedenen Stützpunkten auf. Ein gewaltiger Aufwand für nur zwei Personen: Nicolás Maduro und seine Gattin Cilia Flores."},{"type":"text","content":"Donald Trump beobachtete das Ganze live aus Mar-a-Lago, wie eine Reality-TV-Show, wie er selbst sagte. Und was für eine Show das war. Zuerst gab es einen gezielten Cyberangriff, der in strategischen Teilen von Caracas das Licht ausknipste. Dunkelheit, Stille, und dann das Rauschen von Hubschraubern, die nur dreißig Meter über den Wellen des Karibischen Meeres herangepflogen kamen."},{"type":"instruction","content":"Anmerkung: Kurze Pause, der Moderator schüttelt amüsiert den Kopf.*"},{"type":"text","content":"Und wo war eigentlich diese unbezwingbare russische Flugabwehr, von der Maduro immer geträumt hat? Die S-300 Batterien? Nun ja, wie sich herausstellte, sind chinesische Radare und russische Raketen wie zwei geschiedene Leute, die nicht mehr miteinander reden. Die Technik war verrostet, das Personal fehlte, und am Ende blieb der Himmel über Caracas für die Amerikaner so offen wie ein Scheunentor."},{"type":"title","content":"Der Zugriff im Schlafzimmer"},{"type":"text","content":"Der Zugriff erfolgte im Fuerte Tiuna, dem am besten bewachten Militärkomplex des Landes. Maduro und Cilia wurden buchstäblich im Schlafzimmer überrascht. Sie versuchten noch, in einen stahlverstärkten Panikraum zu flüchten, aber sie waren einfach nicht schnell genug. Die Tür ließ sich nicht mehr schließen, bevor die Delta Force Soldaten, von denen einige extra aus Afrika eingeflogen wurden, im Raum standen. Es wird gemunkelt, dass sie sogar Schweißbrenner dabei hatten, falls die Türen dicker gewesen wären."},{"type":"text","content":"Besonders pikant: Es gab kaum Gegenwehr. Kein einziger venezolanischer Soldat hat auch nur einen Finger gerührt, um seinen Oberkommandierenden zu retten. Warum auch, wenn die eigene Führung einen wahrscheinlich schon längst für das Kopfgeld von fünfzig Millionen Dollar verkauft hat?"},{"type":"title","content":"Die Liste der Verräter"},{"type":"instruction","content":"Anmerkung: Moderator senkt die Stimme und beugt sich verschwörerisch nach vorne.*"},{"type":"text","content":"Hier kommen die Details, die Sie in den großen Nachrichten oft übersehen. Wer hat Maduro wirklich ans Messer geliefert? Es riecht ganz gewaltig nach Hochverrat aus den eigenen Reihen. Delcy Rodríguez und ihr Bruder Jorge waren zufälligerweise genau zum Zeitpunkt des Angriffs in Russland. Ein sehr praktischer Urlaub, finden Sie nicht auch?"},{"type":"text","content":"Und dann ist da noch Diosdado Cabello. Man muss sich nur sein Gesicht bei den späteren Pressekonferenzen ansehen. Er sieht aus wie jemand, der versucht, die Spuren seiner eigenen Beteiligung zu verwischen. Es gibt Berichte, dass die kubanischen Geheimdienstleute, die Maduro jahrelang beschützt haben, plötzlich das Interesse verloren, als die USA begannen, die kostenlosen Öllieferungen nach Kuba abzufangen. Kein Öl, kein Schutz. So einfach ist das im Sozialismus des einundzwanzigsten Jahrhunderts."},{"type":"title","content":"Willkommen im Hotel Brooklyn"},{"type":"text","content":"Maduro genießt nun die Gastfreundschaft der Vereinigten Staaten, allerdings nicht in einem Luxushotel in Florida, sondern im MDC Brooklyn. Ein Ort, den Anwälte und Richter als die Hölle auf Erden bezeichnen. Es ist ein vertikaler Betonklotz, in dem man das Tageslicht nur durch schmale Schlitze sieht und das einzige Geräusch die U-Bahn von New York ist."},{"type":"text","content":"Seine Nachbarschaft kann sich sehen lassen: Der Rapper Sean Diddy Combs, der Kryptobetrüger Sam Bankman-Fried und der legendäre Drogenboss El Mayo Zambada. Seine neue Realität besteht aus einer Zelle von zwei mal drei Metern, einem Edelstahlinventar und dem FBI, das jedes seiner Worte überwacht. Ein ziemlicher Abstieg für jemanden, der sich gerne als Erbe von Bolivar inszeniert hat."},{"type":"title","content":"Ein juristischer Trick der Extraklasse"},{"type":"text","content":"Viele fragen sich: War das legal? Nun, die Trump-Administration war hier sehr kreativ. Sie nannten es keine Invasion, sondern eine polizeiliche Festnahmeoperation. Da Maduro in den USA wegen Drogenterrorismus angeklagt ist, behandelte man ihn einfach wie einen gewöhnlichen Kriminellen. Kein Krieg, kein Kongress-Veto, nur ein Haftbefehl, der mit ein paar hundert Raketen und Elite-Soldaten untermauert wurde. Marco Rubio erklärte trocken, dass man nicht vier Tage bleiben wollte, um alle festzunehmen, sondern sich auf die Priorität Nummer eins konzentrierte."},{"type":"title","content":"Was kommt als Nächstes?"},{"type":"text","content":"In Venezuela herrscht nun eine angespannte Ruhe. Delcy Rodríguez wurde vom obersten Gericht zur Interimspräsidentin ernannt, was man getrost als verfassungsrechtliche Anomalie bezeichnen kann. Währenddessen kontrolliert Diosdado Cabello mit seinen bewaffneten Banden, den Kollektiven, weiterhin die Straßen. Die Menschen in Caracas trauen dem Frieden nicht. Sie gehen in Supermärkte, um Vorräte zu horten, und warten darauf, ob die zweite Welle von Angriffen kommt, die Trump bereits angedroht hat, falls sich nichts ändert."},{"type":"text","content":"Eines ist sicher: Das Kartenhaus des Chavismus ist eingestürzt, aber die Ruinen sind immer noch gefährlich. Es bleibt abzuwarten, ob die Geister der Vergangenheit wie Iván Márquez und seine ELN-Kameraden, die jetzt panisch über die Grenze nach Kolumbien flüchten, dort einen sicheren Hafen finden oder ob sie die Nächsten auf der Liste sind."},{"type":"instruction","content":"Anmerkung: Moderator lehnt sich zurück, lächelt und macht eine abwinkende Geste.*"},{"type":"text","content":"Tja, meine lieben Zuschauer, so schnell kann es gehen. Vom Präsidentenpalast in die Zelle in Brooklyn in weniger als fünf Stunden. Wir halten Sie natürlich über alle weiteren Entwicklungen auf dem Laufenden. Bleiben Sie uns treu, abonnieren Sie den Kanal und vergessen Sie nicht: In der Politik gibt es keine Zufälle, nur gut geplante Überraschungen."},{"type":"text","content":"Bis zum nächsten Mal bei TranslatedPressDE."},{"type":"instruction","content":"Anmerkung: Der Moderator erstarrt für drei Sekunden in einem freundlichen Lächeln, bevor das Bild schwarz wird.*"}]');
    const cont = document.getElementById('script-container');
    data.forEach(i => {
        let el = document.createElement(i.type==='title'?'h2':i.type==='instruction'?'p':'div');
        el.className = i.type==='title'?'timestamp':i.type==='instruction'?'instruction':'speaker-text';
        el.innerText = i.content; cont.appendChild(el);
    });
    let state = { speed:3, font:3, playing:false };
    let anim;
    function update() {
        document.getElementById('s-val').innerText = state.speed;
        document.getElementById('f-val').innerText = state.font;
        const fs = 20 + (state.font * 4);
        document.querySelectorAll('.speaker-text').forEach(e => e.style.fontSize = fs+'px');
    }
    function loop() {
        if(!state.playing) return;
        window.scrollBy(0, state.speed * 0.4);
        anim = requestAnimationFrame(loop);
    }
    function togglePlay() {
        state.playing = !state.playing;
        const btn = document.getElementById('play-pause-btn');
        btn.innerText = state.playing ? "PAUSE" : "START";
        btn.classList.toggle('paused', state.playing);
        if(state.playing) loop(); else cancelAnimationFrame(anim);
    }
    document.getElementById('play-pause-btn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
    document.getElementById('reset-btn').onclick = (e) => { e.stopPropagation(); window.scrollTo(0,0); state.playing=false; cancelAnimationFrame(anim); const btn = document.getElementById('play-pause-btn'); btn.innerText="START"; btn.classList.remove('paused'); };
    document.body.onclick = (e) => { if (!e.target.closest('#controls')) togglePlay(); };
    document.getElementById('controls').onclick = (e) => { e.stopPropagation(); };
    document.getElementById('s-').onclick = () => { if(state.speed>0) state.speed--; update(); };
    document.getElementById('s+').onclick = () => { if(state.speed<20) state.speed++; update(); };
    document.getElementById('f-').onclick = () => { if(state.font>0) state.font--; update(); };
    document.getElementById('f+').onclick = () => { if(state.font<15) state.font++; update(); };
    document.getElementById('save-btn').onclick = () => {
        const blob = new Blob([document.documentElement.outerHTML], {type:'text/html'});
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'teleprompter-recording.html';
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    };
    setTimeout(() => { if(!state.playing) togglePlay(); }, 2000);
    update();
  </script>
</body>
</html>
